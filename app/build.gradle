plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'kotlin-android'
    id 'kotlin-kapt'
    id 'dagger.hilt.android.plugin'
    id 'org.jetbrains.kotlin.plugin.compose'
}

android {
    namespace 'com.tcall.tcall_test'
    compileSdk 35

    defaultConfig {
        applicationId "com.tcall.tcall_test"
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        vectorDrawables {
            useSupportLibrary true
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }
    buildFeatures {
        // dataBinding true // Removed
        compose true
    }
    composeOptions {
        kotlinCompilerExtensionVersion '1.5.13'
    }
    packagingOptions {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }
}

dependencies {

    implementation 'androidx.core:core-ktx:1.16.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.9.0'
    implementation 'androidx.activity:activity-compose:1.10.1'
    implementation "androidx.compose.ui:ui:$compose_ui_version"
    implementation "androidx.compose.ui:ui-tooling-preview:$compose_ui_version"
    implementation "androidx.compose.material:material:$compose_ui_version" // Compose material

    // implementation "androidx.appcompat:appcompat:1.7.0" // Removed
    // implementation "com.google.android.material:material:1.12.0" // Removed
    // implementation "androidx.constraintlayout:constraintlayout:2.1.4" // Removed
    implementation "androidx.navigation:navigation-fragment-ktx:2.7.7" // Kept, assuming hybrid navigation might be used
    implementation "androidx.navigation:navigation-ui-ktx:2.7.7" // Kept, assuming hybrid navigation might be used
    // implementation "androidx.lifecycle:lifecycle-extensions:2.2.0" // Removed

    // Retrofit
    implementation "com.squareup.retrofit2:retrofit:2.11.0" // Updated from ext.retrofit
    implementation "com.squareup.retrofit2:converter-scalars:2.11.0" // Updated from ext.retrofit
    implementation "com.squareup.okhttp3:logging-interceptor:4.12.0" // Updated from ext.retrofitLogger

    // Hilt
    implementation "com.google.dagger:hilt-android:$hiltVersion"
    implementation "androidx.hilt:hilt-navigation-compose:1.2.0"

    implementation "com.google.dagger:dagger:$daggerVersion"
    // implementation 'androidx.legacy:legacy-support-v4:1.0.0' // Removed
    implementation 'androidx.lifecycle:lifecycle-livedata-ktx:2.9.0'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.9.0'
    kapt "com.google.dagger:dagger-compiler:$daggerVersion"
    kapt "com.google.dagger:hilt-android-compiler:$hiltVersion"
    kapt "androidx.hilt:hilt-compiler:$hiltAndroidXVersion"
    implementation "androidx.hilt:hilt-lifecycle-viewmodel:$hiltAndroidXVersion"


    // Kotlin
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk7:$kotlinVersion"

    // Dependencies for local unit tests
    testImplementation "junit:junit:4.13.2" // Kept ext.junitVersion
    testImplementation "org.hamcrest:hamcrest-all:1.3" // Kept ext.hamcrestVersion, consider updating if issues
    testImplementation "androidx.arch.core:core-testing:2.2.0" // Updated archTestingVersion (latest stable)
    testImplementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1" // Updated coroutinesVersion
    testImplementation "org.jetbrains.kotlinx:kotlinx-coroutines-test:1.8.1" // Updated coroutinesVersion
    testImplementation "org.robolectric:robolectric:4.13" // Updated robolectricVersion
    testImplementation "androidx.test.espresso:espresso-core:3.6.1" // Updated espressoVersion
    testImplementation "androidx.test.espresso:espresso-contrib:3.6.1" // Updated espressoVersion
    testImplementation "androidx.test.espresso:espresso-intents:3.6.1" // Updated espressoVersion
    testImplementation "com.google.truth:truth:1.4.4" // Updated truthVersion
    testImplementation "androidx.compose.ui:ui-test-junit4:$compose_ui_version"
    testImplementation "app.cash.turbine:turbine:1.1.0"

    // JVM tests - Hilt
    testImplementation "com.google.dagger:hilt-android-testing:$hiltVersion"
    kaptTest "com.google.dagger:hilt-compiler:$hiltVersion"

    // Dependencies for Android unit tests
    androidTestImplementation "junit:junit:4.13.2" // Kept ext.junitVersion
    androidTestImplementation "org.jetbrains.kotlinx:kotlinx-coroutines-test:1.8.1" // Updated coroutinesVersion
    androidTestImplementation "androidx.compose.ui:ui-test-junit4:$compose_ui_version"

    // AndroidX Test - JVM testing
    testImplementation "androidx.test:core-ktx:1.6.1" // Updated androidXTestCoreVersion
    testImplementation "androidx.test.ext:junit-ktx:1.2.1" // Updated androidXTestExtKotlinRunnerVersion
    testImplementation "androidx.test:rules:1.6.1" // Updated androidXTestRulesVersion
    implementation "androidx.test:core:1.6.1" // Updated androidXTestCoreVersion (implementation, not testImplementation)

    // AndroidX Test - Instrumented testing
    androidTestImplementation "androidx.test:core-ktx:1.6.1" // Updated androidXTestCoreVersion
    androidTestImplementation "androidx.test.ext:junit-ktx:1.2.1" // Updated androidXTestExtKotlinRunnerVersion
    androidTestImplementation "androidx.test:rules:1.6.1" // Updated androidXTestRulesVersion
    androidTestImplementation "androidx.room:room-testing:$roomVersion" // roomVersion is '2.4.2', latest is 2.6.1. Keep for now as Room is not explicitly targeted.
    androidTestImplementation "androidx.arch.core:core-testing:2.2.0" // Updated archTestingVersion
    androidTestImplementation "androidx.test.espresso:espresso-core:3.6.1" // Updated espressoVersion
    androidTestImplementation "androidx.test.espresso:espresso-contrib:3.6.1" // Updated espressoVersion
    androidTestImplementation "androidx.test.espresso:espresso-intents:3.6.1" // Updated espressoVersion
    androidTestImplementation "androidx.test.espresso.idling:idling-concurrent:3.6.1" // Updated espressoVersion
    androidTestImplementation "org.robolectric:annotations:4.13" // Updated robolectricVersion
    implementation "androidx.test.espresso:espresso-idling-resource:3.6.1" // Updated espressoVersion

    // Mockito
    androidTestImplementation "org.mockito:mockito-core:5.12.0"
    //androidTestImplementation "org.mockito:mockito-all:1.10.19" // Removed, covered by core
    androidTestImplementation "org.mockito.kotlin:mockito-kotlin:5.4.0" // Updated artifact and version
    androidTestImplementation "org.mockito:mockito-android:5.12.0" // Updated
    testImplementation "org.mockito:mockito-core:5.12.0"
    //testImplementation "org.mockito:mockito-all:1.10.19" // Removed, covered by core
    testImplementation "org.mockito.kotlin:mockito-kotlin:5.4.0" // Updated artifact and version
    testImplementation "org.mockito:mockito-android:5.12.0" // Updated

    // AndroidX Test - Hilt testing
    androidTestImplementation "com.google.dagger:hilt-android-testing:$hiltVersion"
    kaptAndroidTest "com.google.dagger:hilt-compiler:$hiltVersion"

    debugImplementation "androidx.compose.ui:ui-tooling:$compose_ui_version"
    debugImplementation "androidx.compose.ui:ui-test-manifest:$compose_ui_version"
}