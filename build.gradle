buildscript {
    ext.compose_ui_version = '1.8.2' // Updated
    ext.hiltVersion = '2.56.2' // Updated
    ext.hiltAndroidXVersion = '1.0.0'
    ext.kotlinVersion = '2.1.20' // Updated
    ext.retrofit = '2.9.0'
    ext.retrofitLogger = '3.9.0'
    ext.hiltAndroidXVersion = '1.0.0-alpha01'
    ext.daggerVersion = '2.28'

    dependencies {
        classpath "com.google.dagger:hilt-android-gradle-plugin:$hiltVersion"
        classpath "com.android.tools.build:gradle:8.10.0"
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:2.1.20"
    }

    repositories {
        google()
        mavenCentral()
    }
}// Top-level build file where you can add configuration options common to all sub-projects/modules.
plugins {
    id 'com.android.application' version '8.10.0' apply false
    id 'com.android.library' version '8.10.0' apply false
    id 'org.jetbrains.kotlin.android' version '2.1.20' apply false
    id("org.jetbrains.kotlin.plugin.compose") version "2.1.20" apply false
}

// Define versions in a single place
ext {

    // App dependencies
    accompanistVersion = '0.23.0'
    activityComposeVersion = '1.4.0' // This seems to be an old variable not used by app/build.gradle directly for activity-compose
    androidXVersion = '1.0.0'
    androidXTestCoreVersion = '1.4.1-alpha06'
    androidXTestExtKotlinRunnerVersion = '1.1.4-alpha06'
    androidXTestRulesVersion = '1.4.1-alpha06'
    androidXAnnotations = '1.3.0'
    archLifecycleVersion = '2.6.0-alpha01' // Old, lifecycle versions will be directly updated in app/build.gradle
    archTestingVersion = '2.1.0'
    composeVersion = '1.2.0' // Old, will use compose_ui_version for compose deps
    composeCompilerVersion = '1.2.0' // Old, will be directly updated in app/build.gradle
    coroutinesVersion = '1.6.1'
    dexMakerVersion = '2.12.1'
    espressoVersion = '3.5.0-alpha06'
    hamcrestVersion = '1.3'
    junitVersion = '4.13.2'
    multiDexVersion = '2.0.1'
    robolectricVersion = '4.8.1'
    roomVersion = '2.4.2'
    rulesVersion = '1.0.1'
    truthVersion = '1.1.2'
}